# Use the GLX backend for better performance and effects like blur.
backend = "glx";

# Disable shadows for notification popups (like Dunst).
shadow-exclude = [
  "class_g = 'Dunst'"
];

# Set the corner radius for rounded corners.
# corner-radius = 20;

# Set the border rounding radius.
# round-borders = 20;

# Apply rounded corners only to specific applications.
# This excludes all windows EXCEPT Alacritty and Firefox.
# The exclamation mark (!) negates the condition,
# so this line means "exclude any window that is NOT Alacritty or Firefox",
# effectively applying rounding only to Alacritty and Firefox.
# rounded-corners-exclude = [
#   "!class_g = 'Alacritty'",
#   "!class_g = 'Firefox'"
# ];

# Same logic as above, but for rounded borders (not just corners).
# round-borders-exclude = [
#   "!class_g = 'Alacritty'",
#   "!class_g = 'Firefox'"
# ];
