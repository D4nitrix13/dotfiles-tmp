# ~/.config/tmux/tmux.conf

# Autor: Daniel Benjamin Perez Morales
# GitHub: https://github.com/D4nitrix13
# GitLab: https://gitlab.com/D4nitrix13
# Correo electrónico: danielperezdev@proton.me

# =========================================================
# Plugins
# =========================================================

set -g @plugin 'sainnhe/tmux-fzf'

# Catppuccin Theme
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Plugins para módulos de CPU y batería
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

# =========================================================
# Prefix
# =========================================================

set -g prefix2 C-a
# unbind C-b
# bind C-a send-prefix

# =========================================================
# Resize panes using Alt + Arrow
# =========================================================

bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5

# =========================================================
# Switch windows using Alt + Number
# =========================================================

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# =========================================================
# Floating window binding with tmux
# =========================================================

bind-key -n M-g if-shell -F '#{==:#{session_name},Code }' {
    detach-client
} {
    display-popup -E -w 80% -h 80% "tmux new-session -A -s 'Code ' -n 'Script 󰈺' 'fish'"
}

# =========================================================
# Terminal / Colors
# =========================================================

set-option -ga terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"
# set -g default-terminal "screen-256color"

# =========================================================
# General tmux options
# =========================================================

set -sg escape-time 0
set -g status-interval 1
set -g status-position top
set -g mode-keys vi
set -g mouse on

# =========================================================
# Catppuccin Theme Config
# =========================================================

set -g @catppuccin_flavor "mocha"

# Desactivar panel status de Catppuccin
set -g @catppuccin_pane_status_enabled "off"

# =========================================================
# Status Bar Layout - Catppuccin Mocha Manual
# =========================================================

# No usamos status-left para no empujar las ventanas hacia la derecha
set -g status-left ""
set -g status-left-length 0

set -g status-right-length 180

# Fondo general Catppuccin Mocha
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Separador entre ventanas
set -g window-status-separator " "

# Ventana inactiva
set -g window-status-format "#[fg=#1e1e2e,bg=#b4befe,bold] #I #[fg=#cdd6f4,bg=#313244,bold,italics] #W "

# Ventana activa
set -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I #[fg=#cdd6f4,bg=#45475a,bold,italics] #W "

# Estilo base de ventanas
set -g window-status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g window-status-current-style "bg=#1e1e2e,fg=#cdd6f4"

# =========================================================
# Right status modules
# Session | CPU | Window | Uptime | Battery
# =========================================================

set -g status-right ""

# Session
set -ag status-right "#[fg=#1e1e2e,bg=#f38ba8,bold]  "
set -ag status-right "#[fg=#cdd6f4,bg=#313244,bold] #S "

# CPU
set -ag status-right "#[fg=#1e1e2e,bg=#f9e2af,bold]  "
set -ag status-right "#[fg=#cdd6f4,bg=#313244,bold] #{cpu_percentage} "

# Window index
set -ag status-right "#[fg=#1e1e2e,bg=#a6e3a1,bold]  "
set -ag status-right "#[fg=#cdd6f4,bg=#313244,bold] #I "

# Battery
set -ag status-right "#[fg=#1e1e2e,bg=#b4befe,bold] 󰁹 "
set -ag status-right "#[fg=#cdd6f4,bg=#313244,bold] #{battery_percentage} "

# =========================================================
# Window navigation
# =========================================================

bind -r h previous-window
bind -r l next-window

# =========================================================
# Clear terminal and tmux history
# =========================================================

bind -n C-M-l send-keys "clear -T $TERM && /home/linuxbrew/.linuxbrew/bin/tmux clear-history || clear -T $TERM || clear"\; send-keys Enter

# =========================================================
# Copy mode
# =========================================================

if-shell 'uname | grep -q Linux' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip"'

# =========================================================
# Recarga de configuración
# =========================================================

unbind r
bind r source-file ~/.config/tmux/tmux.conf\; display-message "Config reloaded ~/.config/tmux/tmux.conf"

# =========================================================
# Auto session: Session 
# =========================================================

# Crear la sesión solo si no existe.
# Esto evita errores al recargar tmux.conf.
if-shell "tmux has-session -t 'Session ' 2>/dev/null" "" {
    new-session -d -s "Session " -n "Python3 "

    send-keys -t "Session ":0 'clear -T $TERM && $(which tmux) clear-history && $(which ptpython) --interactive --asyncio --vi --history-file $HOME/.local/share/ptpython/history; cursor_blink' C-m

    new-window -t "Session ":1 -n "Docker "
    send-keys -t "Session ":1 'clear -T $TERM && $(which tmux) clear-history' C-m

    new-window -t "Session ":2 -n "Server "
    send-keys -t "Session ":2 'clear -T $TERM && $(which tmux) clear-history && $(which zsh)' C-m

    select-window -t "Session ":0
}

# Adjuntar automáticamente a la sesión
# tmux attach-session -d -t "Session "

# =========================================================
# TPM Initialization
# =========================================================

setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

if "test ! -d ~/.tmux/plugins/tpm" \
   "run '/bin/git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm --depth=1 && ~/.tmux/plugins/tpm/bin/install_plugins'"

run -b '~/.tmux/plugins/tpm/tpm'